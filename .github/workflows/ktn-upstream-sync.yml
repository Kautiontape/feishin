name: ktn upstream sync
# Weekly heads-up when jeffvli/feishin tags a new release (fork-sync notify mode: no
# branch work). Added 2026-10-01 so upstream updates to this fork are
# reported, per ansible-fleet docs/superpowers/plans/2026-10-01-fleet-update-coverage.md.
on:
  schedule:
    - cron: '0 13 * * 1' # weekly Monday check
  workflow_dispatch:
concurrency:
  group: fork-sync-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write # requested by the reusable workflow even in notify mode
jobs:
  sync:
    uses: Kautiontape/fork-sync/.github/workflows/fork-sync.yml@main
    with:
      upstream: jeffvli/feishin
      mode: notify
      tag_pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    secrets: inherit
